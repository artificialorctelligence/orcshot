name: orcshot
base: core24
confinement: strict
grade: stable
summary: Screenshot capture and annotation tool
description: |
  A Linux port of Windows Greenshot (not affiliated with or endorsed by the
  Greenshot project): region, window, and full-screen capture; an annotation
  editor; configurable global capture hotkeys; and autostart-on-login
  integration.
adopt-info: orcshot

apps:
  orcshot:
    command: bin/orcshot
    # BACKLOG #215: without a desktop file, `snap routine portal-info` answers
    # DesktopFile=. and xdg-desktop-portal grants every picked document to
    # app id "." - the snap's by-app document mount stays empty and every
    # portal file dialog fails after the pick. Same file the Flatpak ships;
    # snapcraft copies it to meta/gui/<app>.desktop and snapd registers it as
    # /var/lib/snapd/desktop/applications/orcshot_orcshot.desktop.
    desktop: usr/share/applications/org.orcshot.Orcshot.desktop
    # BACKLOG #206: snapcraft's gnome extension. It supplies the GNOME
    # platform content snap (GTK, gdk-pixbuf loaders, XKB data, mime
    # database, icon/sound/gtk themes, GI typelibs) and a desktop-launch
    # command-chain that sets XDG_DATA_DIRS, GI_TYPELIB_PATH,
    # GIO_EXTRA_MODULES, GSETTINGS_SCHEMA_DIR, GDK_PIXBUF_MODULE_FILE,
    # XKB_CONFIG_ROOT and the rest before the app starts. #192 had set
    # it aside for a "minimal manual-plugs approach" and then patched
    # each of those variables in by hand as the extension side needed
    # them; the app's own main window, never launched under confinement
    # until 2026-09-11, needed the rest (icon loading crashed on the
    # missing mime database, then GTK segfaulted on the missing XKB
    # data). The #184 throwaway snap used this same extension and its
    # tray was proven live under it. The extension also adds the
    # desktop, desktop-legacy, gsettings, opengl, wayland and x11 plugs.
    extensions: [gnome]
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
    plugs:
      # capture_feedback.py's capture-complete sound (GStreamer, see
      # that module's own docstring) needs real PulseAudio/PipeWire
      # client access under strict confinement, same reasoning as
      # Flatpak's --socket=pulseaudio - without this, playbin would
      # reach PLAYING with no audio sink and produce no actual sound.
      # Not independently verified whether the previous GSound-based
      # sound was silently broken the same way under Snap confinement
      # (never live-tested for audio output specifically, only for
      # not crashing) - plausible given GSound also ultimately needs
      # PulseAudio/PipeWire, but that's an inference, not a confirmed
      # prior gap, so stated as such rather than as fact.
      - audio-playback
      # BACKLOG #212: Save writes to the configured output directory
      # (~/Pictures/Screenshots by default). home is auto-connected on
      # classic distros, needs no store review, and covers every
      # non-hidden path under the real home. A folder outside home goes
      # through the FileChooser portal instead (settings.
      # output_directory_is_reachable) - no removable-media plug.
      - home

slots:
  dbus-orcshot:
    interface: dbus
    bus: session
    name: org.orcshot.Orcshot

parts:
  orcshot:
    plugin: python
    source: .
    # BACKLOG #191: `version: git` resolved to a bare commit-sha in CI
    # (actions/checkout's default shallow, no-tags clone leaves `git
    # describe` nothing to describe against). pyproject.toml is this
    # project's own single source of truth for its version - reading it
    # directly here mirrors how debian/changelog already drives the apt
    # channel's version, with no manual per-release edit to this file.
    override-pull: |
      craftctl default
      craftctl set version="$(grep -m1 '^version' pyproject.toml | sed -E 's/^version *= *"([^"]+)"/\1/')"
    # BACKLOG #215: the python plugin installs only the package; the
    # desktop file and icon the `desktop:` key above points at must be
    # put in place here. The icon is the same non-square PNG the .deb
    # ships at hicolor/128x128 (debian/orcshot.install); the gnome
    # extension's XDG_DATA_DIRS makes $SNAP/usr/share/icons resolvable to
    # the app's own icon lookup, so Icon=org.orcshot.Orcshot in the desktop
    # file finds it there. The launcher entry snapd registers is a separate
    # copy with no XDG_DATA_DIRS of its own, so its Icon= is rewritten to a
    # ${SNAP} path by the sed below (BACKLOG #217).
    override-build: |
      craftctl default
      install -Dm644 org.orcshot.Orcshot.desktop "$CRAFT_PART_INSTALL/usr/share/applications/org.orcshot.Orcshot.desktop"
      install -Dm644 src/orcshot/resources/orcshot.png "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/org.orcshot.Orcshot.png"
      # BACKLOG #217: snapd keeps a theme-name Icon= verbatim and exports
      # nothing for it, so a snap-only machine shows the placeholder. A
      # ${SNAP} path is the one form snapd rewrites to a host-readable
      # /snap/orcshot/current/... path (wrappers/desktop.go rewriteIconLine).
      # Edited on the installed copy only: the source file's theme name is
      # right for the Flatpak and the .deb.
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/128x128/apps/org.orcshot.Orcshot.png|' "$CRAFT_PART_INSTALL/usr/share/applications/org.orcshot.Orcshot.desktop"
    # PyGObject and pycairo deliberately ship no PyPI wheels (they must link
    # the build machine's own libcairo/gobject-introspection), so pip builds
    # them from source unless it can see them as already satisfied. These
    # build-packages (matching the apt names already in stage-packages)
    # install the same bindings into the build container's system Python;
    # PARTS_PYTHON_VENV_ARGS below makes the part's venv see them, and pip's
    # default only-if-needed upgrade strategy then leaves them alone instead
    # of fetching and compiling PyPI's newest release against a mismatched
    # GObject-Introspection ABI (confirmed live: without this, pip pulled
    # PyGObject 3.58 which needs girepository-2.0, not core24's classic
    # girepository-1.0 that apt's own python3-gi is built against).
    build-packages:
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      - libglib2.0-bin
      # BACKLOG #206: update-mime-database, run in override-prime.
      - shared-mime-info
    build-environment:
      - PARTS_PYTHON_VENV_ARGS: "--system-site-packages"
    stage-packages:
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      # BACKLOG #206: explicit, though a dependency already dragged it in -
      # override-prime compiles its database; the gnome extension puts $SNAP/usr/share on XDG_DATA_DIRS.
      - shared-mime-info
      - python3-numpy
      - python3-shapely
      - python3-xlib
      - gir1.2-gtk-3.0
      - gir1.2-rsvg-2.0
      - gir1.2-gdkpixbuf-2.0
      - gir1.2-pango-1.0
      - gir1.2-glib-2.0
      - gir1.2-gstreamer-1.0
      - gstreamer1.0-plugins-base
      - libblas3
      - liblapack3
      # BACKLOG #192: the actual dconf GSettingsBackend GIO module
      # (libdconfsettings.so) - without it, GLib can't load a working
      # backend from inside confinement at all and silently falls back to
      # its keyfile backend, which then fails outright under confinement
      # (no general $HOME write access). Confirmed live: this was already
      # true even after both the schema fix and a real session bus were in
      # place. Pulls in dconf-service and libdconf1 as real dependencies,
      # the same way Snapcraft already resolves every other entry here.
      - dconf-gsettings-backend
      # BACKLOG #192: org.gnome.shell's own schema, so Orcshot's own
      # confined process can resolve Gio.Settings(schema_id="org.gnome.shell")
      # to read/write enabled-extensions (gnome_extension_setup.py). GNOME
      # Shell itself (unconfined, on the host) already has its own copy from
      # its own apt dependency - this is only for Orcshot's in-sandbox
      # GSettings lookup, which otherwise has no schema source at all
      # (confirmed live: Gio.SettingsSchemaSource.get_default() returns None
      # under strict confinement, not just "schema missing").
      - gnome-shell-common
    override-prime: |
      craftctl default
      # numpy/scipy need symlinks at the standard location, not in the blas/
      # subdirectory. The alternatives system that normally creates these
      # doesn't run in Snapcraft's build container, so create them manually.
      mkdir -p "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      ln -sf blas/libblas.so.3 "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libblas.so.3" || true
      ln -sf lapack/liblapack.so.3 "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/liblapack.so.3" || true
      # BACKLOG #192: gnome-shell-common ships raw schema XML, not a
      # compiled gschemas.compiled - a real apt install compiles it via a
      # dpkg trigger, which Snapcraft's staging never runs (same class of
      # gap as the BLAS/LAPACK alternatives symlinks above - confirmed live
      # by inspecting the real .deb's own postinst/triggers, neither calls
      # glib-compile-schemas). Compile it explicitly so
      # Gio.SettingsSchemaSource.get_default() can find it.
      glib-compile-schemas "$CRAFT_PRIME/usr/share/glib-2.0/schemas"
      # BACKLOG #206: the same class of gap for shared-mime-info - it ships
      # packages/freedesktop.org.xml and a real install compiles mime.cache
      # and magic via a dpkg trigger that staging never runs. Without them
      # GIO cannot sniff a PNG and gdk-pixbuf refuses every image.
      update-mime-database "$CRAFT_PRIME/usr/share/mime"
