app-id: org.orcshot.Orcshot
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: orcshot
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=~/.local/share/gnome-shell/extensions:create
modules:
  - name: orcshot
    buildsystem: simple
    sources:
      - type: dir
        path: .
    # org.gnome.Platform//50 already ships PyGObject and pycairo built
    # against its own GTK/GObject-Introspection stack (confirmed live:
    # `import gi` / `import cairo` both succeed out of the box from
    # org.gnome.Sdk//50's python3), the Flatpak-world equivalent of
    # snapcraft.yaml's PARTS_PYTHON_VENV_ARGS: --system-site-packages -
    # so there is nothing to opt into here, and none of Gtk-3.0,
    # Rsvg-2.0, GdkPixbuf-2.0, Pango-1.0, GLib-2.0's typelibs need
    # staging or a GI_TYPELIB_PATH override either, both already
    # confirmed present under the runtime's own girepository-1.0 dir
    # and already on its default search path. numpy, shapely and
    # python-xlib are the only real Depends entries with no runtime-
    # provided equivalent (confirmed live: all three fail to import
    # from a stock org.gnome.Sdk//50 python3) - pip installs them from
    # PyPI, which needs the build sandbox's network share (off by
    # default; see build-options below - the same class of gap
    # snapcraft.yaml hit needing PARTS_PYTHON_VENV_ARGS, different
    # mechanism).
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=/app --no-deps .
      - pip3 install --prefix=/app numpy shapely python-xlib
      - install -Dm644 org.orcshot.Orcshot.desktop /app/share/applications/org.orcshot.Orcshot.desktop
    # gir1.2-gsound-1.0's own GSound-1.0.typelib has no equivalent in
    # org.gnome.Platform//50 (confirmed live: absent from both the
    # runtime and the SDK, and no flathub shared-module builds it
    # either) and would need libcanberra + gsound built from source to
    # add for real - out of scope for this task's own build+--help bar.
    # capture/capture_feedback.py's own `from gi.repository import
    # GSound` is a lazily-deferred, function-local import (see app.py's
    # own play-capture-sound action registration), not a module-level
    # one anything on the --help path reaches, so this gap costs
    # exactly the capture-complete sound and nothing else for now.
  - name: bundled-extensions
    buildsystem: simple
    sources:
      - type: dir
        path: src/orcshot/resources/gnome-shell-extensions
    build-commands:
      - mkdir -p /app/share/orcshot/gnome-shell-extensions
      - cp -r . /app/share/orcshot/gnome-shell-extensions/
  - name: gnome-shell-schema
    buildsystem: simple
    # BACKLOG #192's own real fix, ported: gnome_shell_present()'s
    # Gio.SettingsSchemaSource.get_default().lookup("org.gnome.shell", ...)
    # needs org.gnome.shell's own compiled schema to resolve at all
    # (confirmed live here first: org.gnome.Platform//50 does NOT bundle
    # it - a real difference from Snap's core24 base was checked for,
    # not found, so this fix is still needed here). There is no apt
    # inside a Flatpak build sandbox to stage gnome-shell-common from
    # the way snapcraft.yaml does, so the same real Ubuntu package is
    # instead fetched directly (pinned by sha256, same reproducibility
    # apt itself would give) and only its schema XML extracted - ar/tar
    # unpack a .deb without needing dpkg-deb, both already provided by
    # org.gnome.Sdk. glib-compile-schemas here mirrors override-prime's
    # own timing there, for the identical reason: unpacking a .deb's
    # data.tar never runs its postinst/dpkg-trigger machinery, so the
    # raw schema XML is never compiled without doing it explicitly.
    sources:
      - type: file
        url: http://archive.ubuntu.com/ubuntu/pool/main/g/gnome-shell/gnome-shell-common_46.0-0ubuntu6~24.04.14_all.deb
        sha256: a61d931db26599f20c6dd0d4e7e6acb316871d6e1c1f2f66e07f0807c4f98539
        dest-filename: gnome-shell-common.deb
    build-commands:
      - ar x gnome-shell-common.deb
      - tar xf data.tar.* ./usr/share/glib-2.0/schemas
      - install -Dm644 usr/share/glib-2.0/schemas/org.gnome.shell.gschema.xml
        /app/share/glib-2.0/schemas/org.gnome.shell.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
