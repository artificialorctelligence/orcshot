[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenshot-linux"
version = "0.1.0"
description = "A Linux Mint port of Greenshot"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42",
    "pycairo>=1.23",
    "numpy>=1.26",
    "python-xlib>=0.33",
    "shapely>=2.0",
]

[project.scripts]
greenshot-linux = "greenshot_linux.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/greenshot_linux"]
# GNOME Shell extension resources are OS-packaging data only (copied to
# /usr/share/gnome-shell/extensions/ via debian/greenshot-linux.install,
# which reads straight from the source tree, not the wheel) - nothing
# in the Python package itself ever reads them at a package-relative
# path the way resources/greenshot-linux.png is, so there's no reason
# for them to also end up duplicated under dist-packages/.
exclude = ["src/greenshot_linux/resources/gnome-shell-extensions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "x11: needs a running X server (skipped when DISPLAY is unset)",
    "wayland: needs a running Wayland session (skipped when WAYLAND_DISPLAY is unset)",
]
