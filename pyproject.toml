[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orcshot"
version = "0.1.1"
description = "A Linux port of Greenshot"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42",
    "pycairo>=1.23",
    "numpy>=1.26",
    "python-xlib>=0.33",
    "shapely>=2.0",
]

[project.scripts]
orcshot = "orcshot.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "scipy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orcshot"]
# task #183: src/orcshot/resources/locale/*/LC_MESSAGES/*.mo is generated by
# debian/rules' override_dh_auto_build (msgfmt over po/*.po) before this build
# runs, and is deliberately gitignored as a build artifact - but hatchling's
# default wheel file-selection only picks up files tracked by git, so without
# this, the compiled .mo files exist on disk and still silently never make it
# into the wheel. Confirmed live: a real .deb built and installed with no
# `artifacts` entry here shipped zero locale files at all (`dpkg -L orcshot |
# grep locale` empty), so the language picker had no catalog to load no
# matter what language was picked or how genuinely fresh the restart was.
artifacts = ["src/orcshot/resources/locale/**/*.mo"]
# Most GNOME Shell extension resources are OS-packaging data only
# (copied to /usr/share/gnome-shell/extensions/ via
# debian/orcshot.install, which reads straight from the source tree,
# not the wheel) - the extension .js itself, its metadata.json, and
# its own tray-icon PNGs are never read by the Python package at a
# package-relative path the way resources/orcshot.png is, so there's
# no reason for those specifically to also end up duplicated under
# dist-packages/. icon_geometry.json is the one exception (task #146):
# ui/icons.py's own stock_icon_image reads it via _ICON_GEOMETRY_PATH,
# a package-relative path, specifically so the Python and GJS
# interpreters share one geometry source - excluding the whole
# directory (the original, broader rule here) shipped a package that
# crashed on first launch with FileNotFoundError, confirmed live via
# a real .deb install (task #145) after task #146 quietly broke this
# rule's original "nothing Python-side reads these" premise.
exclude = [
    "src/orcshot/resources/gnome-shell-extensions/**/*.js",
    "src/orcshot/resources/gnome-shell-extensions/**/metadata.json",
    "src/orcshot/resources/gnome-shell-extensions/**/icons/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "x11: needs a running X server (skipped when DISPLAY is unset)",
    "wayland: needs a running Wayland session (skipped when WAYLAND_DISPLAY is unset)",
]
