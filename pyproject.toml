[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenshot-linux"
version = "0.1.0"
description = "A Linux Mint port of Greenshot"
requires-python = ">=3.10"
dependencies = [
    "PyGObject>=3.42",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/greenshot_linux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "x11: needs a running X server (skipped when DISPLAY is unset)",
]
