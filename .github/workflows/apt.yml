name: apt

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get build-dep -y .
          sudo apt-get install -y lintian

      - name: Run the test suite
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e ".[dev]"
          xvfb-run -a .venv/bin/pytest tests -m "not x11 and not wayland" -q

      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Lint the .deb
        run: lintian ../orcshot_*_all.deb

      - name: Move the built .deb into the workspace
        run: mv ../orcshot_*_all.deb .

      - name: Upload the built .deb
        uses: actions/upload-artifact@v4
        with:
          name: orcshot-deb
          path: orcshot_*_all.deb
