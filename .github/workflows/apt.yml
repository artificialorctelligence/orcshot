name: apt

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get build-dep -y .
          sudo apt-get install -y lintian

      - name: Run the test suite
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e ".[dev]"
          xvfb-run -a .venv/bin/pytest tests -m "not x11 and not wayland" -q

      - name: Build the .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Lint the .deb
        run: lintian ../orcshot_*_all.deb

      - name: Move the built .deb into the workspace
        run: mv ../orcshot_*_all.deb .

      - name: Upload the built .deb
        uses: actions/upload-artifact@v4
        with:
          name: orcshot-deb
          path: orcshot_*_all.deb

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download the built .deb
        uses: actions/download-artifact@v4
        with:
          name: orcshot-deb

      - name: Install it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./orcshot_*_all.deb

      - name: Confirm the installed binary launches without crashing
        run: orcshot --help

      - name: Install gnome-shell and headless deps
        run: sudo apt-get install -y gnome-shell dbus-x11

      - name: Launch gnome-shell headless against a fixed D-Bus session bus
        run: |
          mkdir -p /run/user/$(id -u)
          chmod 700 /run/user/$(id -u)
          dbus-daemon --session --address=unix:path=/run/user/$(id -u)/bus --fork
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          nohup gnome-shell --headless --virtual-monitor 1024x768 > /tmp/shell.log 2>&1 &
          disown
          timeout 60 bash -c 'until grep -q "GNOME Shell started" /tmp/shell.log; do sleep 1; done' \
            || { echo "gnome-shell never logged its startup line"; cat /tmp/shell.log; exit 1; }
          pgrep -af gnome-shell || (echo "gnome-shell did not stay running" && cat /tmp/shell.log && exit 1)

      - name: Enable the extension (already installed system-wide by the .deb) and confirm it loads with no errors
        run: |
          # This proves the extension loads, initializes, and its D-Bus
          # name-watcher wires up correctly (the "orcshot-tray-diag" log
          # line, plus no JS errors) - it does not exercise menu
          # construction or rendering (_rebuild, the button actually
          # appearing in the status area). That scope matches this
          # check's own original live-tested design; noted here so it's
          # not mistaken for broader coverage than it actually has.
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          gnome-extensions enable orcshot-tray@orcshot.org
          timeout 60 bash -c 'until grep -q "orcshot-tray-diag" /tmp/shell.log; do sleep 1; done' \
            || { echo "extension never logged its diagnostic line - did not load"; cat /tmp/shell.log; exit 1; }
          if grep -qi "JS ERROR\|Gjs-CRITICAL" /tmp/shell.log; then
            echo "A real JS error was logged - see the log below"
            cat /tmp/shell.log
            exit 1
          fi
          echo "Extension enabled with no JS errors logged"

      - name: Always upload the shell log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-log
          path: /tmp/shell.log
