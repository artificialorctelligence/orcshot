name: flatpak

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    name: flatpak / build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder and add flathub
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install the GNOME runtime and SDK
        run: sudo flatpak install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Read the version from pyproject.toml
        id: version
        # flatpak-builder has no adopt-info/craftctl equivalent to
        # snapcraft's own version-from-source mechanism (BACKLOG #191),
        # so this reads the same single source of truth - pyproject.toml
        # - the same way snapcraft.yaml's own craftctl step does, just
        # as a plain shell step instead of a build-system hook. Keeps
        # the built artifact versioned like orcshot_<version>_all.deb
        # and orcshot_<version>_*.snap instead of a fixed, unversioned
        # orcshot.flatpak (final-review finding, 2026-08-31).
        run: echo "version=$(grep -m1 '^version' pyproject.toml | sed -E 's/^version *= *"([^"]+)"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Build the Flatpak
        run: flatpak-builder --force-clean --repo=repo build-dir org.orcshot.Orcshot.yaml

      - name: Validate the real metainfo against Flathub's own linter
        run: |
          sudo flatpak install -y flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream org.orcshot.Orcshot.metainfo.xml

      - name: Bundle it into a single distributable file
        run: flatpak build-bundle repo "orcshot_${{ steps.version.outputs.version }}.flatpak" org.orcshot.Orcshot

      - name: Upload the built bundle
        uses: actions/upload-artifact@v4
        with:
          name: orcshot-flatpak
          path: orcshot_*.flatpak

  verify-flatpak:
    name: flatpak / verify
    needs: build-flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download the built bundle
        uses: actions/download-artifact@v4
        with:
          name: orcshot-flatpak

      - name: Install flatpak and add flathub
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install the GNOME runtime (the SDK isn't needed to just run the app)
        run: sudo flatpak install -y flathub org.gnome.Platform//50

      - name: Install the built bundle
        run: sudo flatpak install -y ./orcshot_*.flatpak

      - name: Confirm the installed binary launches without crashing
        run: flatpak run org.orcshot.Orcshot --help

      - name: "Regression guard: enable_autostart() must raise nothing but CalledProcessError"
        run: |
          # Final-review CRITICAL fix (2026-08-31): org.gnome.Platform//50
          # ships no systemctl at all (confirmed live: `command -v
          # systemctl` is missing inside the runtime), so
          # autostart.enable_autostart()'s subprocess.run used to raise a
          # bare FileNotFoundError - not subprocess.CalledProcessError,
          # the only exception ui/first_run_setup.py's _run_dialog (and
          # ui/editor_window.py's Preferences checkbox) ever catches.
          # Uncaught, that exception escaped _run_dialog entirely,
          # silently skipping every step after it: hotkey configuration,
          # the bundled-extension install, and mark_first_run_setup_done
          # (so the wizard re-prompted on every single launch). autostart.py
          # now converts "systemctl missing" into the same
          # CalledProcessError shape a real systemctl failure already
          # raises, so that must be the only thing that can ever escape
          # here - this fails on the pre-fix code and passes after it.
          flatpak run --command=python3 org.orcshot.Orcshot -c "
          import subprocess
          from orcshot.autostart import enable_autostart
          try:
              enable_autostart()
          except subprocess.CalledProcessError:
              pass  # the only exception first_run_setup._run_dialog actually handles
          "

      - name: Install the extension the way GNOME would (unpacked into the user dir, unconfined)
        run: |
          # The Flatpak ships no extension and has no home grant (spec
          # 2026-09-11 §4): it asks GNOME to install from
          # extensions.gnome.org (InstallRemoteExtension). Headless CI has
          # no EGO listing to fetch, so this unpacks the same zip where
          # GNOME would put it.
          scripts/pack-extension.sh /tmp/ext
          mkdir -p "$HOME/.local/share/gnome-shell/extensions/orcshot@orcshot.org"
          unzip -q -o /tmp/ext/orcshot@orcshot.org.shell-extension.zip -d "$HOME/.local/share/gnome-shell/extensions/orcshot@orcshot.org"
          test -f "$HOME/.local/share/gnome-shell/extensions/orcshot@orcshot.org/extension.js"

      - name: Install gnome-shell and headless deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnome-shell dbus-x11 libglib2.0-bin

      # Task 3's own live CI run (run 33448654638, job 99672910983) showed
      # bare `flatpak run org.orcshot.Orcshot --help` does NOT need a real
      # systemd --user session bus - it succeeded with only a harmless
      # dconf-CRITICAL warning, because GLib's option parser exits before
      # touching GSettings at all. That finding is about --help's process-
      # launch mechanics only. This job's own next two steps are a
      # different question: they write real GSettings values via
      # dconf-service, which needs a real D-Bus session bus - and that
      # same dconf-CRITICAL line ("unable to create file
      # '/run/user/1001/dconf/user': Permission denied") is direct live
      # evidence this runner has no working XDG_RUNTIME_DIR/dconf
      # environment by default, the same class of gap snap.yml's own hard
      # tier had to solve explicitly for the identical reason (dconf-
      # service needing a real session bus to be reachable at all). So
      # this step stays in, kept for this job's own GSettings-writing
      # steps below, independent of what Task 3 found for bare `--help`.
      - name: Start a real systemd --user session bus
        run: |
          sudo systemctl start user@$(id -u).service
          timeout 30 bash -c 'until [ -S "/run/user/$(id -u)/bus" ]; do sleep 0.5; done' \
            || { echo "systemd --user session bus never appeared"; exit 1; }

      # Real root cause of BACKLOG #193's dconf-CRITICAL warning, found
      # 2026-09-04 after it flakily failed this job's own persistence
      # check for the first time (PR #18): `systemctl start
      # user@<uid>.service` brings up the user manager and (per the
      # step above) its D-Bus session bus, but unlike a real login
      # session opened via pam_systemd, it does not create
      # /run/user/<uid>/dconf/ - dconf-service creates that
      # subdirectory itself, lazily, on first use, and loses that race
      # under this runner's exact timing often enough to matter (this
      # job's own check happened to lose it once; snap.yml's
      # equivalent check reads back through the same confined settings
      # backend it wrote through instead of host dconf directly, which
      # is almost certainly why it hasn't shown this same flakiness -
      # it was never actually protected against this race, just less
      # exposed to it). Creating the directory explicitly here, before
      # anything below tries to write through it, removes the race
      # instead of hoping to win it.
      - name: Work around #193 - create /run/user/<uid>/dconf before anything uses it
        run: |
          mkdir -p "/run/user/$(id -u)/dconf"

      - name: Launch gnome-shell headless
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          nohup gnome-shell --headless --virtual-monitor 1024x768 > /tmp/shell.log 2>&1 &
          disown
          timeout 60 bash -c 'until grep -q "GNOME Shell started" /tmp/shell.log; do sleep 1; done' \
            || { echo "gnome-shell never logged its startup line"; cat /tmp/shell.log; exit 1; }
          pgrep -af gnome-shell || (echo "gnome-shell did not stay running" && cat /tmp/shell.log && exit 1)

      - name: Enable the extension as GNOME's installer would (on the host, not from the sandbox)
        run: |
          # Under Flatpak the app never enables the extension itself:
          # InstallRemoteExtension installs *and* enables. This is the
          # host-side equivalent of that second half.
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          gnome-extensions enable orcshot@orcshot.org

      - name: "Confirm the running Shell loaded the extension, no JS errors"
        run: |
          timeout 60 bash -c 'until grep -q "orcshot: extension enabled" /tmp/shell.log; do sleep 1; done' \
            || { echo "extension never logged its load marker - did not load"; cat /tmp/shell.log; exit 1; }
          if grep -qi "JS ERROR\|Gjs-CRITICAL" /tmp/shell.log; then
            echo "A real JS error was logged - see the log below"
            cat /tmp/shell.log
            exit 1
          fi
          echo "Extension loaded, no JS errors logged"

      - name: "Hello and one list-windows round trip through the sandboxed app (spec 2026-09-11 §6)"
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          # Fed on stdin: the sandbox has no access to the checkout.
          flatpak run --command=python3 org.orcshot.Orcshot - < scripts/ci-shell-roundtrip.py

      - name: Always upload the shell log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-log
          path: /tmp/shell.log
