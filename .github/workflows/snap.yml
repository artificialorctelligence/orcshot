name: snap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-snap:
    name: snap / build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the snap
        uses: canonical/action-build@v1
        id: build

      - name: Upload the built snap
        uses: actions/upload-artifact@v4
        with:
          name: orcshot-snap
          path: ${{ steps.build.outputs.snap }}

  verify-snap:
    name: snap / verify
    needs: build-snap
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download the built snap
        uses: actions/download-artifact@v4
        with:
          name: orcshot-snap

      - name: Install it locally (--dangerous, no store review needed)
        run: sudo snap install --dangerous ./orcshot_*.snap

      - name: "Assert gnome_shell_present() resolves org.gnome.shell under confinement (BACKLOG #192)"
        run: |
          snap run --shell orcshot -c "python3 -c 'from orcshot.gnome_extension_setup import gnome_shell_present; result = gnome_shell_present(); print(\"gnome_shell_present() ->\", result); assert result is True, \"schema unresolvable - gnome-shell-common staging/compile regressed\"'"

      - name: Confirm the installed binary launches without crashing
        run: orcshot --help

      - name: Install the extension the way a user would (unpacked into the user dir, unconfined)
        run: |
          # The snap ships no extension (spec 2026-09-11 §4): a strict snap
          # may neither write it into the home directory nor ask GNOME to
          # install it. A real user gets it from extensions.gnome.org; this
          # runner unpacks the same zip that upload carries, as
          # `gnome-extensions install` would.
          scripts/pack-extension.sh /tmp/ext
          mkdir -p "$HOME/.local/share/gnome-shell/extensions/orcshot@orcshot.org"
          unzip -q -o /tmp/ext/orcshot@orcshot.org.shell-extension.zip -d "$HOME/.local/share/gnome-shell/extensions/orcshot@orcshot.org"
          test -f "$HOME/.local/share/gnome-shell/extensions/orcshot@orcshot.org/extension.js"

      - name: Install gnome-shell and headless deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnome-shell dbus-x11

      - name: Start a real systemd --user session bus
        run: |
          # A bare `dbus-daemon --session` isn't enough once `snap run`
          # needs to work afterward: `snap run` asks systemd over the
          # session bus to create its own confinement scope, which needs
          # org.freedesktop.systemd1.Manager actually registered there - a
          # bare dbus-daemon has no systemd --user attached to it at all.
          # Confirmed live (this PR's own CI): once any listening socket
          # exists at the conventional $XDG_RUNTIME_DIR/bus path,
          # snap-confine probes it and attempts that handshake regardless
          # of whether DBUS_SESSION_BUS_ADDRESS is explicitly exported in
          # the calling shell - a bare dbus-daemon there broke every later
          # `snap run` call in the job with "... is not a snap cgroup for
          # tag snap.orcshot.orcshot". This is a documented, core24-specific
          # snapd bug with a documented fix: start the real systemd --user
          # instance for this UID instead, which provides a real session
          # bus with that interface actually present.
          # https://bugs.launchpad.net/snapd/+bug/2075560
          sudo systemctl start user@$(id -u).service
          timeout 30 bash -c 'until [ -S "/run/user/$(id -u)/bus" ]; do sleep 0.5; done' \
            || { echo "systemd --user session bus never appeared"; exit 1; }

      - name: Launch gnome-shell headless
        run: |
          # gnome-shell (and, transitively, dconf-service) already running
          # matches real desktop conditions - this project's OWN first-run
          # dialog only ever runs while the user's desktop session, dconf
          # included, is already up. Confirmed live (this PR's own prior CI
          # run): the confined enable_extension() write itself gets
          # AppArmor-denied talking to ca.desrt.dconf when attempted BEFORE
          # anything has started dconf-service - a confined snap apparently
          # can't D-Bus-activate it from cold, only talk to an
          # already-running instance. Launching gnome-shell first sidesteps
          # that and matches the real scenario Orcshot actually runs in.
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          nohup gnome-shell --headless --virtual-monitor 1024x768 > /tmp/shell.log 2>&1 &
          disown
          timeout 60 bash -c 'until grep -q "GNOME Shell started" /tmp/shell.log; do sleep 1; done' \
            || { echo "gnome-shell never logged its startup line"; cat /tmp/shell.log; exit 1; }
          pgrep -af gnome-shell || (echo "gnome-shell did not stay running" && cat /tmp/shell.log && exit 1)

      - name: "Exercise Orcshot's own enable_extension() write, confined, and confirm it persists (BACKLOG #192)"
        run: |
          # The exact production call ui/first_run_setup.py makes,
          # confined, with gnome-shell (and dconf-service) already running
          # - matching real usage, where the first-run dialog only ever
          # runs while the user's desktop session is already up. Confirmed
          # live: attempting this same write *before* anything has started
          # dconf-service gets AppArmor-denied (a confined snap can't
          # D-Bus-activate it from cold) - ordering here matters and is
          # deliberate, not incidental.
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          snap run --shell orcshot -c "python3 -c 'import os; os.environ[\"DBUS_SESSION_BUS_ADDRESS\"] = \"unix:path=/run/user/\" + str(os.getuid()) + \"/bus\"; from orcshot.hotkey_setup import GioSettingsBackend; from orcshot.gnome_extension_setup import enable_extension, EXTENSION_UUID; enable_extension(GioSettingsBackend(), EXTENSION_UUID)'"
          snap run --shell orcshot -c "python3 -c 'import os; os.environ[\"DBUS_SESSION_BUS_ADDRESS\"] = \"unix:path=/run/user/\" + str(os.getuid()) + \"/bus\"; from orcshot.hotkey_setup import GioSettingsBackend; current = GioSettingsBackend().get_strv(\"org.gnome.shell\", \"/\", \"enabled-extensions\"); print(\"enabled-extensions ->\", current); assert \"orcshot@orcshot.org\" in current, \"enable_extension write did not persist\"'"

      - name: "Confirm the already-running Shell loads the extension from that write alone (BACKLOG #192)"
        run: |
          # gnome_extension_setup.enable_extension_live() - the direct
          # org.gnome.Shell.Extensions.EnableExtension D-Bus call - is
          # confirmed AppArmor-blocked under Snap's strict confinement
          # (AccessDenied, live-tested). This confirms that doesn't
          # actually matter for Snap: the persisted gsettings write above
          # is picked up by the already-running Shell on its own, live-
          # confirmed, no D-Bus nudge needed. BACKLOG #192's functional
          # question is resolved by this - the extension genuinely works
          # under Snap, just via GSettings' own change notification
          # instead of an instant D-Bus call. Same scope as apt.yml's
          # equivalent check: proves loading/initialization, not menu
          # construction or rendering.
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          # The extension's own permanent load marker, logged from
          # enable() - see extension.js's own comment on that line. It
          # replaces the "orcshot-tray-diag" debug lines this check used
          # to watch for, which BACKLOG #189 commented out. A
          # gnome-extensions info state check was tried here first and
          # printed nothing at all on this headless runner (no output,
          # no error), so this stayed on the log-marker mechanism that
          # is actually proven to work in this environment.
          timeout 60 bash -c 'until grep -q "orcshot: extension enabled" /tmp/shell.log; do sleep 1; done' \
            || { echo "extension never logged its load marker - did not load"; cat /tmp/shell.log; exit 1; }
          if grep -qi "JS ERROR\|Gjs-CRITICAL" /tmp/shell.log; then
            echo "A real JS error was logged - see the log below"
            cat /tmp/shell.log
            exit 1
          fi
          echo "Extension loaded from the persisted write alone, no JS errors logged"

      - name: "Hello and one list-windows round trip through the confined app (spec 2026-09-11 §6)"
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          # Fed on stdin: the confined shell cannot read the checkout.
          snap run --shell orcshot -c 'python3 -' < scripts/ci-shell-roundtrip.py

      - name: Always upload the shell log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-log
          path: /tmp/shell.log
