name: snap

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-snap:
    name: snap / build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the snap
        uses: canonical/action-build@v1
        id: build

      - name: Upload the built snap
        uses: actions/upload-artifact@v4
        with:
          name: orcshot-snap
          path: ${{ steps.build.outputs.snap }}

  verify-snap:
    name: snap / verify
    needs: build-snap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download the built snap
        uses: actions/download-artifact@v4
        with:
          name: orcshot-snap

      - name: Install it locally (--dangerous, no store review needed)
        run: sudo snap install --dangerous ./orcshot_*.snap

      - name: Connect personal-files (manual connect against a local install needs no Canonical review)
        run: sudo snap connect orcshot:dot-local-share-gnome-shell

      - name: "Diagnostic: dump the real confined env around schema resolution (BACKLOG #192)"
        run: |
          snap run --shell orcshot -c "env | grep -E '^(SNAP|XDG_DATA_DIRS|GSETTINGS_SCHEMA_DIR)='"
          snap run --shell orcshot -c "ls -la \$SNAP/usr/share/glib-2.0/schemas/ 2>&1"
          snap run --shell orcshot -c "python3 -c 'import gi; gi.require_version(\"Gio\", \"2.0\"); from gi.repository import Gio; print(\"get_default():\", Gio.SettingsSchemaSource.get_default())'"

      - name: "Assert gnome_shell_present() resolves org.gnome.shell under confinement (BACKLOG #192)"
        run: |
          snap run --shell orcshot -c "python3 -c 'from orcshot.gnome_extension_setup import gnome_shell_present; result = gnome_shell_present(); print(\"gnome_shell_present() ->\", result); assert result is True, \"schema unresolvable - gnome-shell-common staging/compile regressed\"'"

      - name: Confirm the installed binary launches without crashing
        run: orcshot --help

      - name: Trigger the app's real first-run extension-install path
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          # A real GTK dialog can't run headlessly in this job; call the
          # underlying function this task's own Task 1/2 wired in
          # directly, exactly as ui/first_run_setup.py itself calls it -
          # this is deliberately the real production code path, not a
          # CI-only stand-in. Run through `snap run --shell` so $SNAP/
          # $SNAP_REAL_HOME are the real, snapd-set values for a
          # confined process - a bare `python3` call in this shell step
          # would have neither var set at all (Plan Amendment 1 below).
          #
          # The check script is written under $HOME/.local/share/gnome-shell/extensions,
          # not /tmp and not bare $HOME: strict confinement gives the
          # confined shell its own private, empty /tmp via a per-snap
          # mount namespace (confirmed live - a file written to the
          # host's /tmp is simply not there inside `snap run --shell`),
          # ruling out /tmp entirely. Bare $HOME doesn't work either: the
          # mount namespace does show the real host home directory (a
          # file placed there is visible), but reading it from inside
          # confinement fails with EACCES (confirmed live), because this
          # app's snapcraft.yaml plugs only `personal-files`
          # (dot-local-share-gnome-shell) - a narrow AppArmor grant
          # limited to exactly $HOME/.local/share/gnome-shell/extensions -
          # not the broad `home` interface. Writing the check script
          # inside that one already-granted directory keeps it inside
          # the path AppArmor actually allows this snap to read.
          mkdir -p "$HOME/.local/share/gnome-shell/extensions"
          cat > "$HOME/.local/share/gnome-shell/extensions/install_check.py" << 'PYEOF'
          from orcshot.channel_detect import install_bundled_extension_if_needed
          from pathlib import Path
          import os
          bundled = Path(os.environ['SNAP']) / 'share' / 'orcshot' / 'gnome-shell-extensions' / 'orcshot-tray@orcshot.org'
          dest_parent = Path(os.environ['SNAP_REAL_HOME']) / '.local' / 'share' / 'gnome-shell' / 'extensions'
          ok = install_bundled_extension_if_needed('orcshot-tray@orcshot.org', bundled, dest_parent)
          print(f'install_bundled_extension_if_needed -> {ok}')
          assert ok, 'extension install failed even with personal-files connected'
          PYEOF
          snap run --shell orcshot -c 'python3 $SNAP_REAL_HOME/.local/share/gnome-shell/extensions/install_check.py'

      - name: "Exercise Orcshot's own enable_extension() write, confined, and confirm it persists (BACKLOG #192)"
        run: |
          # gnome_shell_present() resolving the schema (previous step) only
          # proves the schema is *visible* - this proves Orcshot's own
          # production write path (gnome_extension_setup.enable_extension,
          # the exact call ui/first_run_setup.py makes) actually reaches
          # real, persistent gsettings storage through the already-plugged
          # gsettings interface, not just an in-process echo.
          snap run --shell orcshot -c "python3 -c 'from orcshot.hotkey_setup import GioSettingsBackend; from orcshot.gnome_extension_setup import enable_extension, TRAY_EXTENSION_UUID; enable_extension(GioSettingsBackend(), TRAY_EXTENSION_UUID)'"
          # Read back with a *fresh* confined process, not the same cached
          # Gio.Settings instance from the write above - GioSettingsBackend
          # caches per (schema, path), so reusing the same instance would
          # only prove its own in-memory cache, not real persistence.
          snap run --shell orcshot -c "python3 -c 'from orcshot.hotkey_setup import GioSettingsBackend; current = GioSettingsBackend().get_strv(\"org.gnome.shell\", \"/\", \"enabled-extensions\"); print(\"enabled-extensions ->\", current); assert \"orcshot-tray@orcshot.org\" in current, \"enable_extension write did not persist\"'"

      - name: Install gnome-shell and headless deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnome-shell dbus-x11

      - name: Launch gnome-shell headless against a fixed D-Bus session bus
        run: |
          mkdir -p /run/user/$(id -u)
          chmod 700 /run/user/$(id -u)
          dbus-daemon --session --address=unix:path=/run/user/$(id -u)/bus --fork
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          nohup gnome-shell --headless --virtual-monitor 1024x768 > /tmp/shell.log 2>&1 &
          disown
          timeout 60 bash -c 'until grep -q "GNOME Shell started" /tmp/shell.log; do sleep 1; done' \
            || { echo "gnome-shell never logged its startup line"; cat /tmp/shell.log; exit 1; }
          pgrep -af gnome-shell || (echo "gnome-shell did not stay running" && cat /tmp/shell.log && exit 1)

      - name: "Activate the extension via Orcshot's own enable_extension_live(), confined, and confirm it loads (BACKLOG #192)"
        run: |
          # Previously this step used the external `gnome-extensions`
          # CLI tool, which runs unconfined and exercises neither of
          # Orcshot's own two enable mechanisms (gnome_extension_setup.
          # enable_extension/enable_extension_live). That proved GNOME
          # Shell *can* load the extension, but never proved Orcshot's
          # own confined process can actually activate it - the gap
          # BACKLOG #192 was filed over. enable_extension's write
          # (previous step) only persists for a *future* login on its
          # own; enable_extension_live's direct D-Bus call is what
          # activates it *this* session (see gnome_extension_setup.py's
          # own docstring) - both are exercised now, through the app's
          # real production code, not a stand-in.
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          snap run --shell orcshot -c "python3 -c 'from orcshot.gnome_extension_setup import enable_extension_live, TRAY_EXTENSION_UUID; enable_extension_live(TRAY_EXTENSION_UUID)'"
          timeout 60 bash -c 'until grep -q "orcshot-tray-diag" /tmp/shell.log; do sleep 1; done' \
            || { echo "extension never logged its diagnostic line - did not load"; cat /tmp/shell.log; exit 1; }
          if grep -qi "JS ERROR\|Gjs-CRITICAL" /tmp/shell.log; then
            echo "A real JS error was logged - see the log below"
            cat /tmp/shell.log
            exit 1
          fi
          echo "Extension activated via Orcshot's own D-Bus call, no JS errors logged"

      - name: Always upload the shell log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-log
          path: /tmp/shell.log
