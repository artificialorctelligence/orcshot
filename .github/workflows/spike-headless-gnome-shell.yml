name: "SPIKE: headless GNOME Shell + real extension load"

# THROWAWAY spike, not a real CI job - manually triggered only. Answers one
# question: does `gnome-shell --headless --virtual-monitor` (confirmed
# working for the compositor itself, in a local LXD container) go on to
# actually load a real extension (orcshot-tray@orcshot.org) on a genuine
# GitHub-hosted VM runner - which has a full systemd/init stack, unlike the
# LXD container this was first tried in, where systemd-logind's D-Bus
# system-bus activation timed out. If this works here, headless Wayland
# tray-extension testing in CI is real and worth designing into the real
# pipeline. If it doesn't, that's answered early and cheaply, same as this
# question was asked in the first place. Delete this workflow file once the
# question is answered either way - it's not meant to be a permanent job.

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gnome-shell and headless deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-shell dbus-x11

      - name: Report gnome-shell version
        run: gnome-shell --version

      - name: Copy the real orcshot-tray extension into the per-user path
        run: |
          mkdir -p ~/.local/share/gnome-shell/extensions/orcshot-tray@orcshot.org
          cp src/orcshot/resources/gnome-shell-extensions/orcshot-tray@orcshot.org/extension.js \
             src/orcshot/resources/gnome-shell-extensions/orcshot-tray@orcshot.org/metadata.json \
             ~/.local/share/gnome-shell/extensions/orcshot-tray@orcshot.org/
          ls -la ~/.local/share/gnome-shell/extensions/orcshot-tray@orcshot.org/

      - name: Launch gnome-shell headless against a fixed D-Bus session bus
        run: |
          mkdir -p /run/user/$(id -u)
          chmod 700 /run/user/$(id -u)
          rm -f /run/user/$(id -u)/bus
          dbus-daemon --session --address=unix:path=/run/user/$(id -u)/bus --fork
          sleep 1
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          nohup gnome-shell --headless --virtual-monitor 1024x768 > /tmp/shell.log 2>&1 &
          disown
          sleep 8
          echo "--- process check ---"
          pgrep -af gnome-shell || echo "NOT RUNNING - shell exited/crashed, see log below"

      - name: Try to enable the real extension
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus
          echo "--- gnome-extensions list ---"
          gnome-extensions list || echo "list failed, exit $?"
          echo "--- gnome-extensions enable ---"
          gnome-extensions enable orcshot-tray@orcshot.org
          ENABLE_EXIT=$?
          echo "enable exit: $ENABLE_EXIT"
          echo "--- gnome-extensions info ---"
          gnome-extensions info orcshot-tray@orcshot.org
          INFO_EXIT=$?
          echo "info exit: $INFO_EXIT"
          if [ "$ENABLE_EXIT" -ne 0 ] || [ "$INFO_EXIT" -ne 0 ]; then
            echo "SPIKE RESULT: FAILED - see the uploaded shell.log artifact"
            exit 1
          fi
          echo "SPIKE RESULT: SUCCESS - extension enabled and loaded headlessly"

      - name: Always upload the shell log for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-log
          path: /tmp/shell.log
